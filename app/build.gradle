plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cleanvoice.player'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cleanvoice.player'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Uses the debug key so the release APK installs directly. Use your own key for Play Store.
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true   // compress the neural-network weights inside the APK
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// RNNoise neural-network weights (~MBs of C source) are downloaded once from xiph.org and checksum-verified.
def rnDir = file('src/main/cpp/rnnoise')
tasks.register('downloadRnnoiseModel') {
    def target = new File(rnDir, 'src/rnnoise_data.c')
    onlyIf { !target.exists() }
    doLast {
        def hash = new File(rnDir, 'model_version').text.trim()
        def tgz = new File(layout.buildDirectory.get().asFile, "rnnoise_data-${hash}.tar.gz")
        tgz.parentFile.mkdirs()
        new URL("https://media.xiph.org/rnnoise/models/rnnoise_data-${hash}.tar.gz").withInputStream { i ->
            tgz.withOutputStream { it << i }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(tgz.bytes).encodeHex().toString()
        if (digest != hash) throw new GradleException("RNNoise model checksum mismatch")
        project.copy {
            from tarTree(resources.gzip(tgz))
            into rnDir
        }
    }
}
tasks.named('preBuild') { dependsOn 'downloadRnnoiseModel' }
