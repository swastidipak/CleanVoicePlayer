plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cleanvoice.player'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cleanvoice.player'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Uses the debug key so the release APK installs directly. Use your own key for Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
